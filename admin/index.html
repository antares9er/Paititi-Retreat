<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Admin — Paititi Retreats</title>
    <link rel="icon" type="image/jpeg" href="/brand_assets/Paititi-Logo.jpeg">

<body>

            <img src="/brand_assets/Paititi-Logo.jpeg" alt="">
